[workspace]
resolver = "2"
members = ["core", "daemon", "gui"]
# The GUI is excluded from a bare `cargo build` so the daemon builds on hosts
# with no GTK 4 development libraries. Build it explicitly with `-p
# capture-to-search-gui`, or everything with `--workspace`.
default-members = ["core", "daemon"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["dipakmdhrm <dipakmdhrm@gmail.com>"]
repository = "https://github.com/dipakmdhrm/capture-to-search"

[workspace.dependencies]
capture-core = { path = "core" }

# --- GTK trio: GUI crate only; the daemon never links these ---
gtk4 = { version = "0.11.4", features = ["v4_14"] }
libadwaita = { version = "0.9.2", features = ["v1_5"] }

# --- Networking ---
# rustls with the `ring` backend: builds without cmake/nasm/go, so minimal
# packaging containers work, and it avoids linking the host's OpenSSL (the
# usual reason a binary built on Ubuntu dies on Fedora).
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "gzip", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

# --- Async / D-Bus ---
tokio = "1.53.1"
futures = "0.3"
zbus = "5"

# --- Config / paths ---
directories = "6.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.4"

# --- Desktop integration ---
ksni = "0.3.6"
notify-rust = "4.18.0"
png = "0.17"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
open = "5.4.2"

# --- Dev ---
tempfile = "3"

# --- Misc ---
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = true
