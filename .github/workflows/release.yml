name: Release

# Two ways in:
#   - Push a version tag manually:  git tag v0.1.0 && git push origin v0.1.0
#   - Called by auto-release.yml on merge to main (workflow_call), which passes
#     the computed version and the freshly-pushed tag as `ref`.

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      version:
        description: Version to release, without the leading "v".
        required: true
        type: string
      ref:
        description: >-
          Git ref to build (the release tag), so the build sees the
          version-bump commit rather than the merge commit that triggered the
          caller.
        required: false
        type: string
        default: ''

env:
  CARGO_TERM_COLOR: always

jobs:
  # Version comes from the workflow_call input, or from the tag name.
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.VERSION }}
    steps:
      - id: v
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

  # The same reusable workflow CI runs on every PR, so this is a repeat of an
  # already-validated build rather than the first attempt.
  build:
    needs: get-version
    uses: ./.github/workflows/build-packages.yml
    with:
      version: ${{ needs.get-version.outputs.version }}
      ref: ${{ inputs.ref }}

  release:
    needs: [get-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.get-version.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.pkg.tar.zst
